name: CI Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.h'
      - '**.hpp'
      - '**.cpp'
      - '**.c'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '**.py'
      - '**.pyx'
      - '**.pxd'
      - '**.pyi'
      - 'setup.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'test/run_all_tests.sh'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - '**.h'
      - '**.hpp'
      - '**.cpp'
      - '**.c'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '**.py'
      - '**.pyx'
      - '**.pxd'
      - '**.pyi'
      - 'setup.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'test/run_all_tests.sh'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  SOMTPARSER_BUILD_JOBS: 2
  SOMTPARSER_WARNINGS_AS_ERRORS: "ON"
  CMAKE_ARGS: -DSOMTPARSER_WARNINGS_AS_ERRORS=ON

jobs:
  test:
    name: CI Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/apt
          build/
        key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt', 'test/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-deps-
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libgmp-dev \
          libmpfr-dev \
          gcc \
          g++
    
    - name: Verify dependencies
      run: |
        cmake --version
        gcc --version
        g++ --version
        pkg-config --version
        pkg-config --exists gmp || echo "GMP not found via pkg-config"
        pkg-config --exists mpfr || echo "MPFR not found via pkg-config"
    
    - name: Make test script executable
      run: chmod +x test/run_all_tests.sh
    
    - name: Run all tests
      run: |
        cd test
        ./run_all_tests.sh
    
    - name: Verify test completion
      run: |
        echo "✅ All tests completed successfully!"
        echo "The workflow will only reach this step if run_all_tests.sh exits with code 0"
        echo "and outputs 'All tests passed!'"

  python:
    name: Python Bindings (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgmp-dev libmpfr-dev libegl1 libgl1

    - name: Install MiniZinc reference solver
      # Match the qualification environment; Ubuntu's older package lacks the
      # JSON FlatZinc output used by the independent semantic checks.
      run: |
        curl --fail --location --retry 3 \
          https://github.com/MiniZinc/MiniZincIDE/releases/download/2.10.1/MiniZincIDE-2.10.1-x86_64-linux-gnu.tgz \
          --output "$RUNNER_TEMP/minizinc.tgz"
        echo "b63dd88491d47b05d0eb0ff4aa1112d1e6f77292c023800b20b98851458ce01c  $RUNNER_TEMP/minizinc.tgz" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/minizinc"
        tar -xzf "$RUNNER_TEMP/minizinc.tgz" -C "$RUNNER_TEMP/minizinc" --strip-components=1
        echo "SOMTPARSER_MINIZINC_EXECUTABLE=$RUNNER_TEMP/minizinc/bin/minizinc" >> "$GITHUB_ENV"
        "$RUNNER_TEMP/minizinc/bin/minizinc" --version
        # The bundled Gecode executable also links Qt's GL/EGL libraries.
        # Exercise it before compiling the package so missing shared libraries
        # fail here rather than appearing as many semantic-test failures.
        printf 'var 1..1: x :: output_var; solve satisfy;\n' > "$RUNNER_TEMP/oracle-smoke.fzn"
        "$RUNNER_TEMP/minizinc/bin/fzn-gecode" "$RUNNER_TEMP/oracle-smoke.fzn"

    - name: Build and install the package
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test,benchmark]" pytest-xdist

    - name: Run the Python test suite
      run: |
        python -W error -m pytest test/python -q -n 2 --dist loadscope
