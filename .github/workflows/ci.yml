name: CI Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.h'
      - '**.hpp'
      - '**.cpp'
      - '**.c'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '**.py'
      - '**.pyx'
      - '**.pxd'
      - '**.pyi'
      - 'setup.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'test/run_all_tests.sh'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - '**.h'
      - '**.hpp'
      - '**.cpp'
      - '**.c'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '**.py'
      - '**.pyx'
      - '**.pxd'
      - '**.pyi'
      - 'setup.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'test/run_all_tests.sh'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  SOMTPARSER_BUILD_JOBS: 2
  SOMTPARSER_WARNINGS_AS_ERRORS: "ON"
  CMAKE_ARGS: -DSOMTPARSER_WARNINGS_AS_ERRORS=ON

jobs:
  test:
    name: CI Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/apt
          build/
        key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt', 'test/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-deps-
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libgmp-dev \
          libmpfr-dev \
          gcc \
          g++
    
    - name: Verify dependencies
      run: |
        cmake --version
        gcc --version
        g++ --version
        pkg-config --version
        pkg-config --exists gmp || echo "GMP not found via pkg-config"
        pkg-config --exists mpfr || echo "MPFR not found via pkg-config"
    
    - name: Make test script executable
      run: chmod +x test/run_all_tests.sh
    
    - name: Run all tests
      run: |
        cd test
        ./run_all_tests.sh
    
    - name: Verify test completion
      run: |
        echo "✅ All tests completed successfully!"
        echo "The workflow will only reach this step if run_all_tests.sh exits with code 0"
        echo "and outputs 'All tests passed!'"

  python:
    name: Python Bindings (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgmp-dev libmpfr-dev

    - name: Build and install the package
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test,benchmark]" pytest-xdist

    - name: Run the Python test suite
      run: |
        python -W error -m pytest test/python -q -n 2 --dist loadscope
